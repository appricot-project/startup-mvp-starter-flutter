name: Flutter RC CI

on:
  pull_request:
    branches:
      - rc
  push:
    branches:
      - feature/FOUNDATION-48

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v1
        with:
          java-version: "12.x"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: "stable"
          cache: true

      - name: Flutter version
        run: flutter --version

      - run: flutter pub get
      # - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
